name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: mypy
        run: python -m mypy
      # The office server is linux and the workshop laptop is not. A platform
      # only branch that type checks on one and not the other is a real defect
      # and this is the cheapest place to find it.
      - name: mypy against linux
        run: python -m mypy --platform linux

  tests:
    name: tests ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      # Walking the chain onto an empty file proves the migrations run at all.
      # The suite then proves they agree with the models.
      - name: upgrade to head
        run: python -m alembic upgrade head
      - name: downgrade to base
        run: python -m alembic downgrade base
      - name: the migrations still match the models
        run: python -m pytest -q tests/test_migrations.py

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: build the wheel
        run: |
          python -m pip install build==1.2.2.post1
          python -m build
      # Installing the wheel on its own is the only environment where a
      # dependency filed under the dev extra shows up as a command that will
      # not start. The test suite cannot see that, because a test run always
      # has the dev extra installed.
      - name: install the wheel alone
        run: python -m pip install dist/*.whl
      # Every command group has to answer --help before anything is set up. A
      # group that imports something only the dev extra provides fails here and
      # nowhere else, because the suite always has the dev extra installed.
      - name: every command answers for itself
        run: |
          sheaveline --version
          sheaveline guide
          # The list comes out of the program rather than being typed here. A
          # hand written list names a group that was renamed six months ago and
          # passes, or names one that never existed and fails for the wrong
          # reason, and this job had both.
          python - <<'PY'
          import subprocess
          from sheaveline.cli import cli

          for name in sorted(cli.commands):
              subprocess.run(["sheaveline", name, "--help"], check=True, capture_output=True)
              print("ok", name)
          PY
      - name: a fresh database comes up
        run: |
          export SHEAVELINE_DATABASE_URL=sqlite+pysqlite:///ci.sqlite3
          sheaveline settings
          sheaveline setup
          sheaveline check
      # The migrations have to build the same database the models describe when
      # the only thing installed is the wheel, because that is what the office
      # server runs.
      - name: the migrations run against the wheel
        run: |
          python -m pip install "alembic==1.14.1"
          python -m alembic upgrade head
          python -m alembic downgrade base

  interfaces:
    name: interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      # The http surface has to describe itself. A route whose response model
      # will not serialise raises here rather than on the first request for it.
      - name: the openapi document builds
        run: |
          python - <<'PY'
          import json
          from sheaveline.api.app import Settings, build_app

          app = build_app(Settings.in_memory())
          document = app.openapi()
          paths = sorted(document["paths"])
          assert len(paths) > 20, paths
          assert "/health" in paths and "/ready" in paths
          print(json.dumps(paths, indent=2))
          PY
      - name: the smoke checks
        run: python -m pytest -q tests/test_smoke.py tests/test_packaging.py
