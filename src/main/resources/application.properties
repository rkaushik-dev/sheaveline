# The service's own settings, the database and the keys among them, are handed to the application
# when it starts. What is here is only how Spring itself should behave.
spring.application.name=sheaveline
spring.main.banner-mode=off
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
server.error.whitelabel.enabled=false
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
